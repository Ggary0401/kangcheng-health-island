<!doctype html>
<html lang="zh-Hant"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>痔瘡不用硬撐｜康澄診所</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap">
<style>:root{--accent:#db6a41;--ink:#211d1d;--cream:#fff8f4;--yellow:#fcea8b;--line:#211d1d26;--muted:#78685e;--side:318px;--glass:#fff8f4e8;--hover:#fcea8b;--paper:#fff;--font-body:"Noto Serif TC","Songti TC","PMingLiU",serif;--font-en:"Cormorant","Noto Serif TC",serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{overscroll-behavior:none;overflow:hidden;-webkit-tap-highlight-color:transparent;background:#e7d9cd;color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,a{font:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--cream);color:var(--ink);min-height:44px;border-radius:9px;padding:9px 13px;touch-action:manipulation}
button:hover{background:var(--hover)}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button[aria-pressed=true],button.active{background:var(--ink);color:var(--cream)}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
.eyebrow{font:700 10px ui-monospace,monospace;letter-spacing:2px;color:var(--accent)}
#app{position:relative;width:100%;height:100dvh;min-height:620px;overflow:hidden;background:radial-gradient(ellipse at 44% 35%,#fffdf9 0%,#fff8f4 44%,#edddcf 100%)}
#stage{position:absolute;inset:0 var(--side) 0 0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%;outline:none;cursor:grab}
#stage canvas:active{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.island-label{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;font-size:11px;padding:3px 9px;min-height:28px;display:flex;align-items:center;border:1px solid #211d1d35;border-radius:999px;background:var(--glass);box-shadow:0 2px 0 #211d1d14;white-space:nowrap;transition:opacity .2s,background .2s;color:var(--ink);will-change:transform}
.island-label strong{color:var(--accent);font:700 10px ui-monospace,monospace;margin-right:5px}
.island-label.selected{background:var(--ink);color:var(--cream);border-color:var(--accent)}
.island-label.selected strong{color:var(--yellow)}
.island-label.dim{opacity:.28}
.names-off .island-label{display:none}
.brand{position:absolute;top:24px;left:24px;z-index:2;display:flex;align-items:center;gap:16px;padding:14px 20px;border-radius:22px;background:var(--glass);box-shadow:0 6px 24px #211d1d1a;backdrop-filter:blur(6px)}
.brand .future{text-decoration:none;font:900 clamp(22px,2.6vw,36px)/.95 Arial,sans-serif;letter-spacing:-2px;color:var(--accent);pointer-events:auto}
.brand .future span{display:block}
.brand-r h1{font-size:19px;letter-spacing:4px}
.brand-r .proj{display:block;font-size:12px;margin-top:6px;font-weight:700}
.brand-r .proj em{font-style:normal;color:var(--accent);margin-right:6px;letter-spacing:1px}
.hero-note{position:absolute;left:32px;top:170px;max-width:190px;pointer-events:none;z-index:1}
.hero-note .number{font:italic 60px/.95 Georgia,serif;color:var(--accent)}
.hero-note h2{font-size:17px;line-height:1.5;margin:8px 0}
.hero-note p{font-size:11px;color:var(--muted);line-height:1.8}
.toolbar{position:absolute;right:calc(var(--side) + 20px);top:28px;display:flex;gap:7px;z-index:5}
.toolbar button{background:var(--glass);font-size:12px;box-shadow:0 4px 14px #211d1d14}
.toolbar .tb-ico{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.6;vertical-align:-1px}
.hud{position:absolute;left:24px;top:112px;z-index:4}
.hud .toggles{display:flex;gap:8px;flex-wrap:wrap;padding:6px;border-radius:999px;background:var(--glass);box-shadow:0 6px 24px #211d1d1a;backdrop-filter:blur(6px)}
.seg{display:flex;gap:2px;align-items:center}
.seg+.seg{padding-left:8px;border-left:1px solid var(--line)}
.hud button{min-height:44px;min-width:44px;border:0;border-radius:999px;background:transparent;padding:6px 10px;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.hud button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hud button:hover{background:var(--hover)}
.hud button[aria-pressed=true],.hud button.on{background:var(--ink);color:var(--cream)}
.sidebar{position:absolute;right:0;top:0;bottom:0;width:var(--side);background:var(--glass);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:6}
.side-head{padding:22px 22px 12px;position:relative}
.side-head h2{font-size:24px;margin:6px 0 10px}
.side-head p{font-size:11px;color:var(--muted);line-height:1.8;margin-bottom:12px}
.search{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;margin-bottom:10px}
.side-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side-tabs button{font-size:12px;border-radius:12px}
.tree{flex:1;overflow:auto;padding:6px 22px 60px}
.tree details{border-bottom:1px solid var(--line)}
.tree summary{list-style:none;display:flex;align-items:center;gap:12px;min-height:52px;cursor:pointer}
.tree summary::-webkit-details-marker{display:none}
.tree summary .no{font:italic 20px Georgia,serif;color:var(--accent);width:30px}
.tree summary .nm{flex:1;font-size:14px;font-weight:600}
.tree summary .ct{font-size:10px;color:var(--muted)}
.tree details.sel summary .nm{color:var(--accent)}
.tree ul{margin:0 0 12px;padding:0 0 0 42px;list-style:none}
.tree li button{min-height:36px;width:100%;text-align:left;border:0;background:transparent;font-size:12px;line-height:1.5;padding:6px 8px;border-radius:7px}
.tree li button:hover{background:var(--hover)}
.tree .flow-row{display:block;width:100%;text-align:left;margin:8px 0;padding:10px 12px;font-size:12px;line-height:1.6}
.tree .flow-row b{display:block;font-size:13px}
.tree .flow-row small{color:var(--muted)}
.tree .flow-row.active{background:var(--ink);color:var(--cream)}
.tree .flow-row.active small{color:var(--glass)}
.tree .empty{font-size:12px;color:var(--muted);padding:24px 0}
.card{position:absolute;left:24px;bottom:210px;width:min(380px,calc(100% - var(--side) - 48px));max-height:calc(100% - 420px);overflow:auto;z-index:7;background:var(--cream);border:1px solid var(--line);border-radius:18px;padding:22px 22px 18px;box-shadow:0 14px 40px #211d1d30}
.card .close{position:absolute;right:10px;top:10px;min-height:36px;width:36px;padding:0;border-radius:50%;font-size:18px}
.card h2{font-size:22px;margin:6px 0 8px;padding-right:34px}
.card .lead{font-size:13px;line-height:1.8;color:#3b3330}
.card .chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chip{border:1px solid var(--line);border-radius:999px;font-size:11px;min-height:30px;padding:3px 10px;background:#fff}
.chip.flow{border-color:var(--accent);color:var(--accent);background:#fff}
.card .items{margin:10px 0 0;padding:0;list-style:none}
.card .items li{border-top:1px solid var(--line);padding:10px 0}
.card .items li.hl{background:#fcea8b66;margin:0 -10px;padding:10px}
.card .items b{font-size:13px;display:block;margin-bottom:3px}
.card .items span{font-size:12px;color:#51463f;line-height:1.75;display:block}
.card .items em{font:normal 10px ui-monospace,monospace;color:var(--accent);letter-spacing:1px}
.card .note{margin-top:12px;font-size:10.5px;color:var(--muted);line-height:1.7}
.dock{position:absolute;left:24px;right:calc(var(--side) + 24px);bottom:142px;display:flex;justify-content:center;gap:6px;z-index:3;pointer-events:none;flex-wrap:wrap}
.dock button{pointer-events:auto;min-height:34px;min-width:34px;padding:0 8px;border-radius:999px;font:700 11px ui-monospace,monospace;background:var(--glass)}
.dock button.on{background:var(--ink);color:var(--cream)}
.controls{position:absolute;left:24px;right:calc(var(--side) + 24px);bottom:20px;z-index:4;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:10px 16px 12px;box-shadow:0 8px 28px #211d1d22}
.control-tabs{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.control-tabs button{min-height:34px;font-size:12px;border-radius:999px;padding:4px 14px}
.control-tabs .status{margin-left:auto;font:10px ui-monospace,monospace;color:var(--muted)}
.panel{display:none;margin-top:8px}
.panel.active{display:block}
.day-row{display:flex;gap:12px;align-items:center}
.day-row .play{width:44px;padding:0;border-radius:50%}
#clock{font:700 20px ui-monospace,monospace;min-width:58px}
#day{flex:1;accent-color:var(--accent)}
.ticks{display:flex;justify-content:space-between;font:9px ui-monospace,monospace;color:var(--muted);margin:2px 0 0 114px}
.control-note{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:6px}
.term-buttons,.heart-buttons{display:flex;gap:6px;flex-wrap:wrap}
.term-buttons button,.heart-buttons button{min-height:34px;font-size:12px;padding:3px 12px;border-radius:999px}
.log{position:absolute;right:calc(var(--side) + 20px);top:84px;width:300px;max-height:calc(100% - 330px);display:flex;flex-direction:column;z-index:8;background:var(--cream);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 40px #211d1d30;padding:14px}
.log-head{display:flex;justify-content:space-between;align-items:flex-start}
.log-head h3{font-size:16px}
.log-head button{min-height:32px;width:32px;padding:0;border-radius:50%}
.log-tabs{display:flex;gap:6px;margin:10px 0}
.log-tabs button{min-height:32px;font-size:12px;padding:2px 12px;border-radius:999px}
.log-tabs button[aria-selected=true]{background:var(--ink);color:var(--cream)}
.log-filters{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.live{font:700 10px ui-monospace,monospace;display:flex;gap:5px;align-items:center;color:var(--accent)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.log select{flex:1;min-height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:11px}
#log-list{list-style:none;margin:0;padding:0;overflow:auto;max-height:260px;font-size:12px;line-height:1.7}
#log-list li{border-top:1px solid var(--line);padding:7px 0}
#log-list time{font:10px ui-monospace,monospace;color:var(--accent);margin-right:6px}
.overview-panel{font-size:12px;line-height:1.9}
.overview-panel b{font:italic 26px Georgia,serif;color:var(--accent)}
.mascot{position:absolute;right:calc(var(--side) + 20px);bottom:20px;z-index:5;display:none}
.intro{position:absolute;inset:0;z-index:30;background:#211d1d66;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.intro-box{width:min(344px,calc(100% - 32px));background:var(--cream);border-radius:18px;padding:24px;box-shadow:0 20px 60px #0004}
.intro-box h2{font-size:22px;margin:8px 0 10px}
.intro-box p{font-size:13px;line-height:1.8;color:#51463f}
.intro-actions{display:flex;justify-content:space-between;margin-top:20px}
.intro-actions .next{background:var(--ink);color:var(--cream)}
.loading{position:absolute;inset:0;z-index:40;background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:opacity .5s}
.loading h2{font:900 40px Arial,sans-serif;color:var(--accent);letter-spacing:-1px}
.loading p{font-size:12px;color:var(--muted)}
.loading.done{opacity:0;pointer-events:none}
.mob-only{display:none}
.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.toolbar .primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.primary:hover,.toolbar .primary:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.island-label.feat{border-color:#d9a84a;box-shadow:0 2px 0 #d9a84a66}
.cta-box{margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#fff;border:1px solid var(--accent);display:flex;flex-direction:column;gap:6px}
.cta-box b{font-size:14px;color:var(--accent)}
.cta-box span{font-size:12px;line-height:1.7;color:#51463f}
.book-box{width:min(380px,calc(100% - 32px))}
.book-links{display:flex;flex-direction:column;gap:8px;margin:14px 0 10px}
.bk{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;font-size:14px}
.bk.main{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.book-addr{font-size:12px!important;margin-bottom:4px}
.book-note{font-size:11px!important;color:var(--muted)!important}
.nudge{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--nudge-b,150px));z-index:12;display:flex;align-items:center;gap:10px;max-width:min(560px,calc(100% - var(--side) - 32px));padding:10px 12px 10px 18px;border-radius:999px;background:var(--cream);border:1px solid var(--accent);box-shadow:0 10px 30px #211d1d33;font-size:13px;line-height:1.5}
.nudge button{min-height:40px;white-space:nowrap}
.nudge #nudge-x{width:40px;padding:0;border-radius:50%}
.sheet-handle{display:none;width:100%;min-height:24px;height:24px;border:0;background:transparent;padding:0;margin:-10px 0 4px;align-items:center;justify-content:center}
.sheet-handle i{display:block;width:40px;height:4px;border-radius:2px;background:#211d1d44;margin:0 auto}
.mobile-close{display:none;position:absolute;right:14px;top:14px;width:44px;padding:0;border-radius:50%}
@media(max-width:860px){

.nudge{border-radius:18px;left:10px;right:10px;transform:none;max-width:none;bottom:auto;top:calc(138px + env(safe-area-inset-top))}
.toolbar button{padding:6px 10px!important;font-size:11px}

#stage{inset:0}
.sidebar{top:auto;bottom:0;left:0;right:0;width:auto;height:68dvh;transform:translateY(105%);transition:transform .3s;border-left:0;border-top:1px solid var(--line);border-radius:20px 20px 0 0;z-index:20;padding-bottom:env(safe-area-inset-bottom)}

.side-head{padding:18px 18px 8px}
.side-head h2{font-size:20px;padding-right:50px}
.tree{padding:4px 18px 40px}
.tree summary{min-height:56px}
.tree li button{min-height:44px;font-size:13px}
.brand{top:calc(10px + env(safe-area-inset-top));left:10px;padding:8px 12px;gap:10px;border-radius:16px}
.brand .future{font-size:18px;letter-spacing:-1px}
.brand-r h1{font-size:15px;letter-spacing:2px}
.brand-r .proj{font-size:10px;margin-top:3px}
.hero-note{display:none}
.toolbar{right:10px;left:auto;top:calc(10px + env(safe-area-inset-top));gap:6px}

.hud{left:10px;right:10px;top:calc(72px + env(safe-area-inset-top))}
.hud .toggles{padding:4px;border-radius:999px;justify-content:space-between;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.hud .toggles::-webkit-scrollbar{display:none}
#times{display:none}
.seg+.seg{padding-left:0;border-left:0}

.hud button{min-width:44px;padding:4px 2px}
.island-label{font-size:10px;padding:2px 7px;min-height:24px}
.island-label.selected,.island-label:not(.selected){}
body:not(.names-off) .island-label:not(.selected) strong{margin-right:0}
.island-label:not(.selected){font-size:0;padding:2px 6px}
.island-label:not(.selected) strong{font-size:11px}
.card{left:8px;right:8px;width:auto;bottom:calc(122px + env(safe-area-inset-bottom));max-height:34dvh;border-radius:18px;padding:14px 16px 12px}
.card.tall{max-height:62dvh}
.card .close{top:6px;right:6px;width:44px;min-height:44px}
.card h2{font-size:19px}
.card .chip{min-height:36px}
.controls{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));padding:8px 12px 10px;border-radius:16px}
.control-tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:6px}
.control-tabs::-webkit-scrollbar{display:none}
.control-tabs button{white-space:nowrap;min-height:40px;flex:0 0 auto}
.control-tabs .status{display:none}
.control-note,.ticks{display:none}
.term-buttons,.heart-buttons{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.term-buttons button,.heart-buttons button{min-height:40px;white-space:nowrap;flex:0 0 auto}
.day-row{gap:10px}
#day{height:32px}
.dock{display:none}

.intro-box{padding:20px}
}
@media(max-width:860px) and (max-height:520px){
.brand-r .proj,.hud{display:none}
.card{max-height:50dvh;left:auto;width:min(360px,52%);bottom:78px}
.sidebar{height:86dvh}
}
@media(max-width:430px){.brand-r{display:none}.brand{padding:8px 12px}.brand .future{font-size:20px}}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:9px 13px;border:1px solid var(--line);border-radius:9px;background:var(--glass);color:var(--ink);text-decoration:none;font-size:12px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.toolbar .btn{box-shadow:0 4px 14px #211d1d14}
.cta-box .btn{align-self:flex-start}

.ci-theme .eyebrow,.ci-theme .dock button,.ci-theme .live,.ci-theme .status,.ci-theme .ticks,.ci-theme .island-label strong{font-family:var(--font-en);font-weight:700;letter-spacing:1.5px}

.side-cta{display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--cream)}
.side-cta>*{flex:1;min-height:44px;font-size:12px;padding:6px 8px}
.card-head{display:flex;gap:12px;align-items:center;padding-right:44px}
.card-tile{flex:0 0 auto;width:46px;height:46px;border-radius:12px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);display:grid;place-items:center;font:italic 21px Georgia,serif}
.card-head h2{margin:2px 0 0;padding-right:0}
.card-head .eyebrow{font-size:10px}
.chip.cnt{border-style:dashed;color:var(--muted)}
.site-link{display:block;margin:12px 0 2px;padding:12px;border:1px solid var(--accent);border-radius:12px;text-align:center;color:var(--accent);font-weight:700;text-decoration:none;font-size:13px}
.site-link:hover{background:var(--accent);color:#fff}
.item-label{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;max-width:160px;padding:2px 10px 2px 3px;min-height:26px;border:1px solid var(--accent);border-radius:999px;background:var(--glass);font-size:11px;color:var(--ink);cursor:pointer;white-space:nowrap;box-shadow:0 2px 0 #211d1d14;will-change:transform}
.item-label b{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.item-label span{overflow:hidden;text-overflow:ellipsis;min-width:0}
@media(max-width:860px){
.hud,.controls,.dock,.hero-note,#home,#book,#quiz,.log{display:none!important}
.toolbar{top:calc(10px + env(safe-area-inset-top,0px));right:10px;flex-direction:column}
.toolbar #sidebar-toggle{min-height:48px;padding:6px 14px!important;width:auto;font-size:12px;border-radius:12px}
.toolbar #sidebar-toggle .tb-t{display:inline}
.brand:not(.ci) .brand-r{display:block}
.brand:not(.ci) .future{font-size:17px}
.brand:not(.ci) .brand-r h1{font-size:14px;letter-spacing:2px}
.brand:not(.ci) .brand-r .proj{font-size:10px}
.brand.ci{gap:10px}
.brand.ci .ci-id{display:block;border:0;padding:0}
.brand.ci .brand-r{display:none}
.ci-mark{width:66px}
.ci-name{font-size:12px;letter-spacing:2px}
.ci-en{font-size:11px;letter-spacing:3px}
.island-label{font-size:11px!important;padding:3px 9px!important;min-height:28px}
.island-label strong,body:not(.names-off) .island-label:not(.selected) strong{margin-right:5px!important;font-size:11px}
.sidebar{height:52dvh}
.sidebar.tall{height:84dvh}
.sidebar .side-head{padding:2px 16px 8px}
.side-head .eyebrow,.side-head h2,.side-head p{display:none}
.search{width:calc(100% - 56px);margin-bottom:8px}
.mobile-close{top:2px;right:16px;min-height:44px;width:44px;border-radius:10px;align-items:center;justify-content:center;font-size:16px}
.tree{padding-bottom:12px}
.card{bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:38dvh}
.card.tall{max-height:72dvh}
.nudge{top:calc(76px + env(safe-area-inset-top,0px))}
}
.item-label.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.item-label.on b{background:var(--yellow);color:var(--ink)}

.ilinks{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.ilinks a{display:block;padding:9px 12px;border:1px solid var(--accent);border-radius:10px;color:var(--accent);text-decoration:none;font-size:12.5px;line-height:1.5;font-weight:700;background:var(--paper)}
.ilinks a:hover{background:var(--accent);color:#fff}
.brand.logo-img{background:var(--cream);gap:14px;padding:10px 18px 10px 14px;border-radius:16px}
.brand-img{display:block;height:34px;width:auto}
.load-logo{width:min(260px,70vw);height:auto}
@media(max-width:860px){.brand-img{height:26px}.brand.logo-img{padding:8px 12px;gap:10px}.brand.logo-img .brand-r h1{font-size:13px;letter-spacing:2px}.brand.logo-img .brand-r .proj{display:none}}
@media(max-width:430px){.brand.logo-img .brand-r{display:none}}
.card .items small.src{display:block;margin-top:6px;font-size:10.5px;line-height:1.6;color:var(--muted)}
</style>

    D.flows.forEach(function (f, i) { if (sel > -1 && sel !== i) return; h += '<li><time>' + pad(8 + i % 12) + ':' + pad((i * 17) % 60) + '</time>' + esc(D.islands[f.a].name) + ' → ' + esc(D.islands[f.b].name) + '：' + esc(f.t) + '</li>'; });
    $('#log-list').innerHTML = h;
  }
  $('#log-flow').onchange = renderLog;
  $('#overview-panel').innerHTML = '<b>' + N + '</b> 座島　<b>' + totalItems + '</b> 個細項　<b>' + D.flows.length + '</b> 條串聯<br>' + D.overview;
  $$('.log-tabs button').forEach(function (b) {
    b.onclick = function () { var ov = b.dataset.lt === 'overview'; $$('.log-tabs button').forEach(function (x) { x.setAttribute('aria-selected', x === b); }); $('#overview-panel').hidden = !ov; $('#log-body').hidden = ov; };
  });

  /* ---------- sync visual state ---------- */
  function relatedSet() { var s = {}; if (S.sel > -1) { s[S.sel] = 1; flowsOf(S.sel).forEach(function (fi) { s[D.flows[fi].a] = 1; s[D.flows[fi].b] = 1; }); } if (S.flow > -1) { s[D.flows[S.flow].a] = 1; s[D.flows[S.flow].b] = 1; } return s; }
  function sync() {
    document.body.classList.toggle('names-off', !S.names);
    var tg = Object.keys(S.tags);
    islands.forEach(function (o, i) {
      var tags = tagsOf(i), ok = !tg.length || tg.some(function (t) { return tags[t]; });
      o.label.classList.toggle('selected', i === S.sel); o.label.classList.toggle('dim', !ok);
      o.ty = i === S.sel ? 0.7 : 0;
    });
    $$('#dock button').forEach(function (b) { b.classList.toggle('on', +b.dataset.i === S.sel); });
    flowObjs.forEach(function (f, fi) {
      var rel = S.sel > -1 ? (D.flows[fi].a === S.sel || D.flows[fi].b === S.sel) : S.flow === fi;
      f.line.visible = S.flows || rel;
      f.line.material.opacity = (S.flows && !rel && (S.sel > -1 || S.flow > -1)) ? 0.25 : 0.9;
    });
    $('#status').textContent = S.sel > -1 ? pad(S.sel + 1) + ' ' + D.islands[S.sel].name : S.flow > -1 ? D.flows[S.flow].t : N + ' 座島 / ' + totalItems + ' 個細項';
    setOffset(); renderTree();
  }

  /* ---------- intro ---------- */
  var step = 0;
  function introShow() {
    var s = D.intro[step]; $('#intro-count').textContent = 'HELLO / ' + pad(step + 1); $('#intro-title').textContent = s.h; $('#intro-body').textContent = s.p;
    $('#intro-next').textContent = step === D.intro.length - 1 ? '開始探索' : '下一步 →';
  }
  function introEnd() { $('#intro').hidden = true; try { sessionStorage.setItem('intro-' + D.id, '1'); } catch (e) { } }
  $('#intro-skip').onclick = introEnd;
  $('#intro-next').onclick = function () { if (step >= D.intro.length - 1) introEnd(); else { step++; introShow(); } };
  var seen = false; try { seen = sessionStorage.getItem('intro-' + D.id); } catch (e) { }
  if (!seen) { $('#intro').hidden = false; introShow(); }

  /* ---------- loop ---------- */
  var last = performance.now(), v3 = new T.Vector3();
  function frame(now) {
    var dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
    if (!S.freeze) {
      if (S.playing) { S.time = (S.time + dt * 24) % 1440; applyTime(); }
      windmills.forEach(function (w) { w.rotation.z += dt * 1.4; });
      flowObjs.forEach(function (f) { f.t = (f.t + dt * 0.14) % 1; f.curve.getPoint(f.t, f.dot.position); f.dot.visible = S.couriers; });
      walkT = (walkT + dt * 0.06) % N; var wi = Math.floor(walkT), wf = walkT - wi, A = islands[wi].pos, B = islands[(wi + 1) % N].pos;
      walker.position.set(A.x + (B.x - A.x) * wf + 1.6, 0.1 + Math.abs(Math.sin(now / 160)) * 0.12, A.z + (B.z - A.z) * wf + 1.6);
      walker.rotation.y = Math.atan2(B.x - A.x, B.z - A.z); walker.visible = S.couriers;
      armL.rotation.z = Math.sin(now / 140) * 0.9 + 0.9;
      flowObjs.forEach(function (f) { f.dot.position.y += Math.abs(Math.sin(now / 150 + f.t * 20)) * 0.12; f.dot.rotation.y = now / 800; });
      crowds.forEach(function (cr, ci) {
        cr.forEach(function (c) { c.a += dt * c.s; var o = islands[ci]; c.m.position.set(Math.cos(c.a) * c.r, 0.12 + Math.abs(Math.sin(now / 170 + c.a * 9)) * 0.08, Math.sin(c.a) * c.r); c.m.rotation.y = -c.a + (c.s > 0 ? Math.PI : 0); c.m.visible = S.couriers; });
      });
      clouds.forEach(function (c) { c.position.x += dt * c.userData.sp; if (c.position.x > 130) c.position.x = -130; });
      boats.forEach(function (b) { b.a += dt * b.s; b.g.position.set(cx + Math.cos(b.a) * b.r * 1.5, -0.45 + Math.sin(now / 500 + b.a * 5) * 0.06, cz + Math.sin(b.a) * b.r * 1.15); b.g.rotation.y = -b.a + (b.s > 0 ? 0 : Math.PI); });
      birds.forEach(function (b) { b.a += dt * b.s; b.g.position.set(cx + Math.cos(b.a) * b.r * 1.4, b.h + Math.sin(now / 700 + b.ph) * 0.6, cz + Math.sin(b.a) * b.r); b.g.rotation.y = -b.a + (b.s > 0 ? Math.PI : 0); var fl = Math.sin(now / 90 + b.ph) * 0.6; b.lw.rotation.z = fl; b.rw.rotation.z = -fl; });
    }
    ['th', 'ph', 'dist', 'tx', 'tz'].forEach(function (k) { cam[k] += (camT[k] - cam[k]) * Math.min(1, dt * 6); });
    islands.forEach(function (o) { o.y += (o.ty - o.y) * Math.min(1, dt * 8); o.g.position.y = o.y; });
    view();
    var w = stage.clientWidth, h = stage.clientHeight;
    islands.forEach(function (o) {
      v3.set(o.pos.x, o.y + 4.3, o.pos.z).project(camera);
      var x = (v3.x * 0.5 + 0.5) * w, y = (-v3.y * 0.5 + 0.5) * h;
      o.label.style.transform = 'translate(' + (x - o.label.offsetWidth / 2).toFixed(1) + 'px,' + (y - 14).toFixed(1) + 'px)';
    });
    itemLabels.forEach(function (l) {
      v3.set(l.x, 1.6, l.z).project(camera);
      l.el.style.transform = 'translate(' + ((v3.x * 0.5 + 0.5) * w - l.el.offsetWidth / 2).toFixed(1) + 'px,' + ((-v3.y * 0.5 + 0.5) * h - 12).toFixed(1) + 'px)';
    });
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  resize(); cam.dist = camT.dist = baseDist(); applyTime(); sync(); view();
  requestAnimationFrame(frame);
  setTimeout(function () { $('#loading').classList.add('done'); }, 500); setTimeout(function () { $('#loading').hidden = true; }, 1100);
  window.__island = { select: select, S: S };
})();
</script>
